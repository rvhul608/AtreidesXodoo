name: brightloop

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: brightloop_dev
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://brightloop:password@postgres:5432/brightloop_dev
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-brightloop-local-development-secret-change-me}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  postgres_data:
